<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>贪吃蛇小游戏</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #dbeafe, #ede9fe);
    font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
  }
  .game-wrap {
    background: #fff;
    border-radius: 16px;
    padding: 24px 28px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
    text-align: center;
  }
  h1 { font-size: 22px; color: #2e7d32; letter-spacing: 4px; margin-bottom: 14px; }
  .score-bar {
    display: flex;
    justify-content: space-between;
    width: 400px;
    margin: 0 auto 12px;
    font-size: 15px;
    color: #666;
  }
  .score-bar b { color: #2e7d32; font-size: 18px; margin-left: 4px; }
  .canvas-box {
    position: relative;
    width: 400px;
    height: 400px;
    margin: 0 auto;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: inset 0 0 0 2px rgba(46, 125, 50, 0.18);
  }
  canvas { display: block; }
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(10, 25, 15, 0.6);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    color: #fff;
    font-size: 18px;
    line-height: 1.6;
  }
  #overlay-text { white-space: pre-line; }
  .btn {
    padding: 9px 26px;
    font-size: 16px;
    border: none;
    border-radius: 8px;
    background: #43a047;
    color: #fff;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn:hover { background: #388e3c; }
  .hidden { display: none !important; }
  .tips { margin-top: 12px; font-size: 13px; color: #9e9e9e; }
</style>
</head>
<body>
  <div class="game-wrap">
    <h1>贪 吃 蛇</h1>
    <div class="score-bar">
      <span>得分<b id="score">0</b></span>
      <span>最高分<b id="best">0</b></span>
    </div>
    <div class="canvas-box">
      <canvas id="game" width="400" height="400"></canvas>
      <div class="overlay" id="overlay">
        <div id="overlay-text">按方向键开始游戏</div>
        <button class="btn hidden" id="restart">重新开始</button>
      </div>
    </div>
    <p class="tips">方向键 / WASD 控制移动 · 空格键 暂停 / 继续</p>
  </div>

<script>
(function () {
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var scoreEl = document.getElementById('score');
  var bestEl = document.getElementById('best');
  var overlay = document.getElementById('overlay');
  var overlayText = document.getElementById('overlay-text');
  var restartBtn = document.getElementById('restart');

  var GRID = 20;                      // 每边格子数
  var CELL = canvas.width / GRID;     // 每格像素
  var BASE_SPEED = 160;               // 初始移动间隔（毫秒）
  var MIN_SPEED = 70;                 // 最快速度

  var snake, dir, nextDir, food, score, speed, timer, state;
  state = 'ready'; // ready | playing | paused | over

  var best = 0;
  try { best = Number(localStorage.getItem('snakeBest')) || 0; } catch (e) {}
  bestEl.textContent = best;

  function reset() {
    snake = [{ x: 9, y: 10 }, { x: 8, y: 10 }, { x: 7, y: 10 }];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score = 0;
    speed = BASE_SPEED;
    scoreEl.textContent = '0';
    placeFood();
    draw();
  }

  function placeFood() {
    var f;
    do {
      f = { x: Math.floor(Math.random() * GRID), y: Math.floor(Math.random() * GRID) };
    } while (snake.some(function (s) { return s.x === f.x && s.y === f.y; }));
    food = f;
  }

  function start(d) {
    reset();
    // 允许指定开局方向，但不能与初始朝向相反（初始向右）
    if (d && !(d.x === -dir.x && d.y === -dir.y)) nextDir = d;
    state = 'playing';
    overlay.classList.add('hidden');
    restartBtn.classList.add('hidden');
    clearTimeout(timer);
    loop();
  }

  function loop() {
    timer = setTimeout(function () {
      step();
      if (state === 'playing') loop();
    }, speed);
  }

  function step() {
    dir = nextDir;
    var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // 撞墙
    if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID) return gameOver();

    // 撞到自己（不吃食物时尾巴会让位，所以不检查最后一节）
    var willEat = (head.x === food.x && head.y === food.y);
    var body = willEat ? snake : snake.slice(0, -1);
    for (var i = 0; i < body.length; i++) {
      if (body[i].x === head.x && body[i].y === head.y) return gameOver();
    }

    snake.unshift(head);
    if (willEat) {
      score += 10;
      scoreEl.textContent = score;
      speed = Math.max(MIN_SPEED, speed - 4); // 吃得越多越快
      placeFood();
    } else {
      snake.pop();
    }
    draw();
  }

  function pause() {
    state = 'paused';
    clearTimeout(timer);
    overlayText.textContent = '已暂停\n按空格键继续';
    restartBtn.classList.add('hidden');
    overlay.classList.remove('hidden');
  }

  function resume() {
    state = 'playing';
    overlay.classList.add('hidden');
    loop();
  }

  function gameOver() {
    state = 'over';
    clearTimeout(timer);
    if (score > best) {
      best = score;
      try { localStorage.setItem('snakeBest', best); } catch (e) {}
      bestEl.textContent = best;
    }
    overlayText.textContent = '游戏结束\n本局得分：' + score;
    restartBtn.classList.remove('hidden');
    overlay.classList.remove('hidden');
  }

  // ---------- 绘制 ----------
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    // 底色与网格
    ctx.fillStyle = '#12241a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.lineWidth = 1;
    for (var i = 1; i < GRID; i++) {
      ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, canvas.height); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(canvas.width, i * CELL); ctx.stroke();
    }

    // 食物（红苹果）
    var fx = food.x * CELL + CELL / 2;
    var fy = food.y * CELL + CELL / 2;
    ctx.fillStyle = '#ff5a5f';
    ctx.beginPath(); ctx.arc(fx, fy, CELL * 0.36, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.65)';
    ctx.beginPath(); ctx.arc(fx - 3, fy - 3, 2.5, 0, Math.PI * 2); ctx.fill();

    // 蛇身（头亮尾暗）
    for (var j = snake.length - 1; j >= 0; j--) {
      var s = snake[j];
      var t = j / Math.max(snake.length - 1, 1);
      var pad = 1.5;
      ctx.fillStyle = j === 0 ? '#8ef07f'
        : 'rgb(' + Math.round(70 - 30 * t) + ',' + Math.round(200 - 70 * t) + ',' + Math.round(105 - 40 * t) + ')';
      rr(s.x * CELL + pad, s.y * CELL + pad, CELL - pad * 2, CELL - pad * 2, 5);
      ctx.fill();
    }

    // 蛇眼睛
    var h = snake[0];
    var cx = h.x * CELL + CELL / 2;
    var cy = h.y * CELL + CELL / 2;
    var perpX = dir.y, perpY = dir.x; // 垂直于前进方向
    ctx.fillStyle = '#0d1f13';
    for (var k = -1; k <= 1; k += 2) {
      ctx.beginPath();
      ctx.arc(cx + dir.x * 4 + perpX * k * 4, cy + dir.y * 4 + perpY * k * 4, 2.2, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // ---------- 键盘 ----------
  var DIRS = {
    ArrowUp: { x: 0, y: -1 }, ArrowDown: { x: 0, y: 1 },
    ArrowLeft: { x: -1, y: 0 }, ArrowRight: { x: 1, y: 0 },
    w: { x: 0, y: -1 }, s: { x: 0, y: 1 }, a: { x: -1, y: 0 }, d: { x: 1, y: 0 }
  };

  document.addEventListener('keydown', function (e) {
    if (e.key === ' ' || e.code === 'Space') {
      e.preventDefault();
      if (state === 'playing') pause();
      else if (state === 'paused') resume();
      else start(); // 待开始或已结束时空格直接开局
      return;
    }
    var d = DIRS[e.key];
    if (!d) return;
    e.preventDefault();
    if (state === 'ready' || state === 'over') {
      start(d); // 按方向键直接以该方向开局
      return;
    }
    if (state === 'paused') resume();
    // 禁止 180 度掉头
    if (d.x === -dir.x && d.y === -dir.y) return;
    nextDir = d;
  });

  restartBtn.addEventListener('click', function () { start(); });

  // 切走窗口时自动暂停
  window.addEventListener('blur', function () {
    if (state === 'playing') pause();
  });

  // 初始化
  reset();
  overlayText.textContent = '按方向键开始游戏';
  overlay.classList.remove('hidden');
})();
</script>
</body>
</html>
